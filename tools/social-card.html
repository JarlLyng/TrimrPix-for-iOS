<!DOCTYPE html>
<!--
  Generator for docs/social-card.png (the og:image on every page).

  Serve the repo and capture this page at exactly 1200x630:

    python3 -m http.server 4189
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=docs/social-card.png --window-size=1200,630 \
      http://localhost:4189/tools/social-card.html

  It is kept in the repo rather than regenerated by hand because the first card
  was produced by a throwaway script: when the before/after figure changed, the
  numbers were baked into the PNG and nobody could edit them.

  The figure is measured, not illustrative. 5,104,062 bytes -> 997,850 bytes
  (80.4%) is a CC0 photo (Wikimedia Commons, 5712x4284) run through the 1.5.0
  build at the 1 MB target with the app's default metadata settings. If the
  figure changes, change it here and in the og:image:alt on every page in docs/.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
      --brand: #A435D2;
      --text:  #121212;
      --text-2:#5c5c66;
      --tint:  #F3E3FA;
  }
  *, *::before, *::after { box-sizing: border-box; }

  /* The card is the whole page, so a 1200x630 capture needs no cropping. */
  body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Outfit, system-ui, sans-serif;
  }
  .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #fff;
      overflow: hidden;
      flex: none;
  }
  /* the soft brand circle bleeding off the right edge */
  .card::before {
      content: "";
      position: absolute;
      width: 880px;
      height: 880px;
      border-radius: 50%;
      background: var(--tint);
      top: -126px;
      left: 707px;
  }
  .inner { position: relative; height: 100%; padding: 56px 72px; }

  .mark {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -.02em;
      color: var(--text);
      margin: 0 0 42px;
  }
  .mark em { font-style: normal; color: var(--brand); }

  h1 {
      font-size: 78px;
      font-weight: 500;
      line-height: 1.07;
      letter-spacing: -.035em;
      color: var(--text);
      margin: 0 0 46px;
      max-width: 700px;
  }
  h1 em { font-style: normal; color: var(--brand); }

  .figures {
      display: flex;
      align-items: baseline;
      gap: 26px;
      font-size: 54px;
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1;
  }
  .before { color: var(--text-2); }
  .arrow  { color: var(--brand); font-size: 42px; }
  .after  { color: var(--brand); }

  .labels {
      display: flex;
      gap: 26px;
      margin-top: 12px;
      font-size: 21px;
      color: var(--text-2);
  }
  .labels .l-before { width: 182px; }
  .labels .l-arrow  { width: 42px; }

  .url {
      position: absolute;
      left: 72px;
      bottom: 56px;
      font-size: 22px;
      color: var(--text-2);
  }

  /* phone, right-hand side */
  .phone {
      position: absolute;
      right: 76px;
      top: 88px;
      width: 312px;
      height: 486px;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(40, 10, 60, .16);
      overflow: hidden;
  }
  .phone img {
      display: block;
      width: 100%;
      /* crop to the part of the configure screen that reads at this size */
      margin-top: -4px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <p class="mark">Trimr<em>Pix</em></p>
    <h1>Smaller photos.<br><em>No duplicates.</em></h1>

    <div class="figures">
      <span class="before">5.1 MB</span>
      <span class="arrow">&rarr;</span>
      <span class="after">1.0 MB</span>
    </div>
    <div class="labels">
      <span class="l-before">before</span>
      <span class="l-arrow"></span>
      <span>after, same photo, same place</span>
    </div>

    <p class="url">trimrpixforios.iamjarl.com</p>
  </div>

  <div class="phone">
    <img src="../docs/screenshot-2-configure.png" alt="">
  </div>
</div>
</body>
</html>
